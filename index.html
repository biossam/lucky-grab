<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUCKY GRAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gothic+A1:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--surface:#fff;--ink:#0b0b45;--ink2:#3d3d66;--muted:#74748c;--line:#e3e3ea;--accent:#3a9bfa;
  --p1:#3a9bfa;--p2:#f08a24;--p1bg:#eaf3fc;--p2bg:#fdf1e8;--p1line:#b0d1f0;--p2line:#f3c9a8;
  --display:"Gaegu","Nanum Pen Script",cursive;--body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;--radius:6px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:var(--body);
  user-select:none;-webkit-user-select:none;word-break:keep-all}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 시작 화면 */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;background:rgba(250,250,250,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:opacity .35s;z-index:10}
.overlay.hide{opacity:0;pointer-events:none}
.cat{width:84px;height:auto;margin-bottom:4px;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
.kicker{font-family:var(--display);font-weight:700;font-size:clamp(20px,2.6vw,28px);color:var(--accent);letter-spacing:.08em}
.overlay h1{font-family:var(--display);font-weight:700;font-size:clamp(64px,11vw,140px);line-height:.95;margin:.05em 0 .25em;text-align:center}
.overlay h1 em{font-style:normal;text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:.07em;text-underline-offset:.12em}
.sub{font-size:14px;font-weight:700;letter-spacing:.25em;margin-right:-.25em;color:var(--muted);margin-bottom:22px}
.cards{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
.card{--c:var(--p1);--cb:var(--p1bg);--cl:var(--p1line);display:flex;align-items:center;gap:16px;padding:10px 28px 10px 22px;min-width:260px;
  border:2px solid var(--cl);border-radius:var(--radius);background:var(--surface);cursor:pointer;color:var(--ink);
  font:inherit;text-align:left;transition:background .2s,border-color .2s,transform .2s cubic-bezier(.25,1,.5,1)}
.card.p2{--c:var(--p2);--cb:var(--p2bg);--cl:var(--p2line)}
.card:hover,.card.sel{background:var(--cb);border-color:var(--c);transform:translateY(-2px)}
.card b{font-family:var(--display);font-weight:700;font-size:96px;line-height:1;color:var(--c)}
.card strong{display:block;font-family:var(--display);font-weight:700;font-size:38px;line-height:1.05}
.card small{font-size:14px;font-weight:500;color:var(--ink2)}
.hint{margin-top:26px;font-size:14px;color:var(--muted);text-align:center}

/* 점수판 */
#hud{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none;z-index:4}
.score{--c:var(--p1);--cl:var(--p1line);display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-top:3px solid var(--c);border-radius:var(--radius);padding:6px 18px 6px 14px}
.score.p2{--c:var(--p2);--cl:var(--p2line);flex-direction:row-reverse;padding:6px 14px 6px 18px}
.score .lab{display:flex;flex-direction:column;line-height:1.25}
.score small{font-weight:700;letter-spacing:.12em;color:var(--c);font-size:11px}
.score i{font-style:normal;font-size:13px;color:var(--ink2)}
.score b{font-family:var(--display);font-weight:700;font-size:48px;line-height:1}
.score.off{visibility:hidden}

/* 집게 옆 꼬리표 */
.tag{--c:var(--p1);position:fixed;left:0;top:0;display:flex;align-items:center;gap:6px;pointer-events:none;z-index:3;
  transform:translate(-9999px,0);transition:opacity .25s}
.tag.p2{--c:var(--p2)}
.tag .ring{position:relative;width:38px;height:38px}
.tag svg{width:38px;height:38px;transform:rotate(-90deg)}
.tag circle{fill:#fff;stroke-width:3.5}
.tag .bg{stroke:var(--line)}
.tag .fg{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.tag .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px}
.tag .pill{background:var(--c);color:#fff;font-weight:700;font-size:10px;letter-spacing:.06em;padding:3px 8px;border-radius:99px}
.tag.hide{opacity:0}

/* 카운트다운 */
#count{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:6;
  font-family:var(--display);font-weight:700;font-size:min(36vw,48vh);line-height:1;color:var(--ink);
  -webkit-text-stroke:min(1.2vw,1.6vh) #fff;paint-order:stroke fill}
#count.anim{animation:pop .7s cubic-bezier(.2,1.5,.4,1)}
#count.fade{animation:fadeout .6s forwards}
@keyframes pop{0%{transform:scale(.4) rotate(-10deg);opacity:0}40%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes fadeout{to{opacity:0;transform:scale(1.15)}}

/* 점수 팝업 */
.pop{--c:var(--p1);position:fixed;left:0;top:0;pointer-events:none;z-index:5;font-family:var(--display);font-weight:700;font-size:64px;line-height:1;
  color:var(--c);-webkit-text-stroke:8px #fff;paint-order:stroke fill;white-space:nowrap;text-align:center;
  animation:rise 1.4s ease-out forwards}
.pop.p2{--c:var(--p2)}
.pop small{display:block;font-size:26px;color:var(--ink);-webkit-text-stroke:6px #fff}
@keyframes rise{0%{opacity:0;translate:-50% -20%;scale:.5}15%{opacity:1;scale:1.12}100%{opacity:0;translate:-50% -170%;scale:1}}

/* 안내 */
#help{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px 20px;flex-wrap:wrap;justify-content:center;
  font-size:13px;color:var(--ink2);background:rgba(255,255,255,.92);border:1px solid var(--line);padding:8px 18px;border-radius:var(--radius);
  pointer-events:none;max-width:96vw;z-index:4;transition:opacity .3s}
#help.hide{opacity:0}
#help .g{white-space:nowrap}
#help .l{color:var(--p1);font-weight:700}
#help .p{color:var(--p2);font-weight:700}
kbd{font-family:var(--body);font-weight:700;background:#fff;border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;
  padding:0 6px;font-size:11px;color:var(--ink);display:inline-block;line-height:18px}
#toast{position:fixed;top:22px;left:50%;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:7px 16px;border-radius:var(--radius);
  font-size:14px;font-weight:500;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}

#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:var(--bg);z-index:30;transition:opacity .4s}
#loading b{font-family:var(--display);font-weight:700;font-size:52px}
#loading small{color:var(--muted);font-size:15px;text-align:center;padding:0 20px}
#loading.gone{opacity:0;pointer-events:none}
</style>

<canvas id="c"></canvas>

<div id="hud">
  <div class="score p1" id="s1"><div class="lab"><small>PLAYER 1</small><i>파랑 냥이</i></div><b>00</b></div>
  <div class="score p2" id="s2"><div class="lab"><small>PLAYER 2</small><i>주황 냥이</i></div><b>00</b></div>
</div>

<div class="tag p1 hide" id="t1"><div class="ring"><svg viewBox="0 0 38 38"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15"/></svg><div class="num">20</div></div><span class="pill">PLAYER 1</span></div>
<div class="tag p2 hide" id="t2"><div class="ring"><svg viewBox="0 0 38 38"><circle class="bg" cx="19" cy="19" r="15"/><circle class="fg" cx="19" cy="19" r="15"/></svg><div class="num">20</div></div><span class="pill">PLAYER 2</span></div>

<div id="count"></div>
<div id="help" class="hide"></div>

<div class="overlay" id="start">
  <svg class="cat" viewBox="0 0 120 100" aria-hidden="true">
    <path d="M18 44 L22 8 L48 28 Z" fill="#b0d1f0" stroke="#0b0b45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M102 44 L98 8 L72 28 Z" fill="#b0d1f0" stroke="#0b0b45" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="60" cy="58" rx="46" ry="38" fill="#fff" stroke="#0b0b45" stroke-width="5"/>
    <circle cx="43" cy="56" r="5" fill="#0b0b45"/><circle cx="77" cy="56" r="5" fill="#0b0b45"/>
    <path d="M54 66 Q60 72 60 66 Q60 72 66 66" fill="none" stroke="#0b0b45" stroke-width="4" stroke-linecap="round"/>
    <circle cx="33" cy="68" r="6" fill="#ffc2d4"/><circle cx="87" cy="68" r="6" fill="#ffc2d4"/>
  </svg>
  <div class="kicker">LUCKY GRAB</div>
  <h1>ARE YOU<br><em>READY?</em></h1>
  <div class="sub">SELECT PLAYERS</div>
  <div class="cards">
    <button class="card p1" data-mode="solo"><b>1</b><span><strong>PLAYER</strong><small>혼자 · 세로 화면</small></span></button>
    <button class="card p2" data-mode="duo"><b>2</b><span><strong>PLAYERS</strong><small>둘이 · 가로 화면</small></span></button>
  </div>
  <div class="hint">숫자 <kbd>1</kbd> <kbd>2</kbd> 를 눌러도 돼요 · 화면을 누르거나 키를 누르면 음악이 나와요</div>
</div>

<div id="loading"><b>LUCKY GRAB</b><small>공을 채우는 중…</small></div>

<script>
function showFail(msg){
  const el=document.getElementById('loading'); if(!el) return;
  el.classList.remove('gone');
  el.innerHTML='<b>LUCKY GRAB</b><small></small>';
  el.querySelector('small').textContent='화면을 띄우지 못했어요 · '+msg;
}
addEventListener('error',e=>{ if(!window.__ready) showFail(e.message||'알 수 없는 오류'); });
addEventListener('unhandledrejection',e=>{ if(!window.__ready) showFail(String(e.reason&&e.reason.message||e.reason)); });
</script>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const P1C = 0x3a9bfa, P2C = 0xf08a24;
const INK = '#0b0b45';
const TURN = 20;                 // 자동으로 집기까지 걸리는 시간(초)

/* ---------------- 렌더러 ---------------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('#c'), antialias: true, powerPreference: 'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfafafa);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.75;

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 300);

scene.add(new THREE.HemisphereLight(0xffffff, 0xe3e3ea, 0.9));
const sun = new THREE.DirectionalLight(0xfff4ea, 1.5);
sun.castShadow = true;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
sun.shadow.radius = 4;
scene.add(sun, sun.target);

let hiQ = false;
function applyQuality(){
  const pr = hiQ ? Math.min(devicePixelRatio, 2) : Math.min(devicePixelRatio, 1.25);
  renderer.setPixelRatio(pr);
  const ms = hiQ ? 2048 : 1024;
  sun.shadow.mapSize.set(ms, ms);
  if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map = null; }
  resize();
}

/* ---------------- 그림(텍스처) ---------------- */
const texCache = new Map();
function canvasTex(key, w, h, draw, repeat){
  if (texCache.has(key)) return texCache.get(key);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  texCache.set(key, t); return t;
}
function paw(g, x, y, s, color){
  g.fillStyle = color;
  g.beginPath(); g.ellipse(x, y + s * .25, s * .42, s * .34, 0, 0, 7); g.fill();
  for (const [dx, dy] of [[-.42, -.22], [-.15, -.48], [.15, -.48], [.42, -.22]]){
    g.beginPath(); g.ellipse(x + dx * s, y + dy * s, s * .14, s * .18, 0, 0, 7); g.fill();
  }
}
function star(g, x, y, r, color){
  g.fillStyle = color; g.beginPath();
  for (let i = 0; i < 10; i++){ const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  g.closePath(); g.fill();
}
// 공 위 고양이 얼굴 (구의 앞쪽 = u 0.25)
function faceTex(key, base, blush = '#ff9fbf'){
  return canvasTex(key, 512, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const cx = w * .25, cy = h * .53;
    g.fillStyle = INK;
    for (const s of [-1, 1]){ g.beginPath(); g.ellipse(cx + s * 26, cy - 8, 7, 9, 0, 0, 7); g.fill(); }
    g.fillStyle = '#fff';
    for (const s of [-1, 1]){ g.beginPath(); g.arc(cx + s * 26 + 2, cy - 11, 2.6, 0, 7); g.fill(); }
    g.fillStyle = blush;
    for (const s of [-1, 1]){ g.beginPath(); g.ellipse(cx + s * 44, cy + 10, 10, 6, 0, 0, 7); g.fill(); }
    g.strokeStyle = INK; g.lineWidth = 3.5; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx - 9, cy + 6); g.quadraticCurveTo(cx - 4.5, cy + 13, cx, cy + 6); g.quadraticCurveTo(cx + 4.5, cy + 13, cx + 9, cy + 6); g.stroke();
    g.lineWidth = 2;
    for (const s of [-1, 1]) for (const dy of [-3, 4]){
      g.beginPath(); g.moveTo(cx + s * 56, cy + 2 + dy); g.lineTo(cx + s * 76, cy + dy * 1.8); g.stroke();
    }
  });
}

/* ---------------- 공용 재질 ---------------- */
const PAL = ['#cfc2f2', '#f3c9a8', '#a9dcbd', '#b0d1f0', '#e6d891', '#f1bccd', '#ffffff'];
const ballGeo = new THREE.SphereGeometry(1, 36, 24);
const earGeo = new THREE.ConeGeometry(.3, .42, 16);
const plainMats = PAL.map(c => new THREE.MeshPhysicalMaterial({ color: c, roughness: .35, clearcoat: .7, clearcoatRoughness: .2 }));
const catMats = PAL.map((c, i) => new THREE.MeshPhysicalMaterial({ map: faceTex('face' + i, c), roughness: .35, clearcoat: .7, clearcoatRoughness: .2 }));
const earMats = PAL.map(c => new THREE.MeshPhysicalMaterial({ color: c, roughness: .4, clearcoat: .5 }));
const goldMat = new THREE.MeshPhysicalMaterial({ map: faceTex('gold', '#ffc93c', '#ff8fb0'), metalness: .55, roughness: .22, clearcoat: 1, clearcoatRoughness: .08 });
const goldEar = new THREE.MeshPhysicalMaterial({ color: '#ffc93c', metalness: .55, roughness: .22, clearcoat: 1 });
const whiteMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .3, clearcoat: .8, clearcoatRoughness: .15 });
const SHARED = new Set([ballGeo, earGeo]);

/* ---------------- 세계(고양이 뽑기 기계) ---------------- */
const G = { mode: 'duo', W: 10, D: 3, H: 7, F: .6, HT: 1.8, HB: .8, FD: .9 };
const Y_TOP = G.H - 1.6, Y_MIN = 1.45;
let world = null;
let balls = [], claws = [], chutes = [];

function add(mesh, x, y, z, cast = false){ mesh.position.set(x, y, z); mesh.castShadow = cast; mesh.receiveShadow = true; world.add(mesh); return mesh; }
function rbox(w, h, d, mat, x, y, z, rad = .25){ return add(new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 4, Math.min(rad, w / 2 - .01, h / 2 - .01, d / 2 - .01)), mat), x, y, z); }
const std = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .6, ...o });

function buildWorld(mode){
  if (world){
    scene.remove(world);
    world.traverse(o => { if (o.geometry && !SHARED.has(o.geometry)) o.geometry.dispose(); });
  }
  G.mode = mode; G.W = mode === 'duo' ? 10 : 6;
  const { W, D, H, F, HT, HB, FD } = G;
  world = new THREE.Group(); scene.add(world);
  balls = []; claws = []; chutes = [];
  const px = 100;

  // 바닥: 연보라 체크
  const floorTex = canvasTex('floor' + W, W * px, D * px, (g, w, h) => {
    g.fillStyle = '#f4f0fd'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(207,194,242,.35)';
    for (let x = 0; x < w; x += 50) g.fillRect(x, 0, 25, h);
    for (let y = 0; y < h; y += 50) g.fillRect(0, y, w, 25);
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), std(0xffffff, { map: floorTex, roughness: .8 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; world.add(floor);

  // 뒷벽: 하늘색에 구름 · 별 · 발자국
  const backTex = canvasTex('back' + W, W * px, H * px, (g, w, h) => {
    const grd = g.createLinearGradient(0, 0, 0, h); grd.addColorStop(0, '#d6e8fa'); grd.addColorStop(1, '#eaf3fc');
    g.fillStyle = grd; g.fillRect(0, 0, w, h);
    let s = 7; const R = () => (s = s * 16807 % 2147483647) / 2147483647;
    g.fillStyle = 'rgba(255,255,255,.95)';
    for (let i = 0; i < W * .9; i++){
      const x = R() * w, y = h * (.08 + R() * .4), k = 28 + R() * 26;
      g.beginPath(); g.arc(x, y, k, 0, 7); g.arc(x + k, y - k * .4, k * 1.15, 0, 7); g.arc(x + k * 2.1, y, k * .9, 0, 7); g.fill();
      g.fillRect(x, y, k * 2.1, k * .9);
    }
    for (let i = 0; i < W * 3; i++) star(g, R() * w, R() * h * .7, 8 + R() * 10, R() < .5 ? '#e6d891' : '#ffffff');
    for (let i = 0; i < W * 1.2; i++) paw(g, R() * w, h * (.55 + R() * .4), 22, 'rgba(255,255,255,.7)');
  });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(W, H), std(0xffffff, { map: backTex, roughness: .85 }));
  back.position.set(0, H / 2, -D / 2); back.receiveShadow = true; world.add(back);

  const sideMat = std(0xc9dff3, { roughness: .85 });
  for (const s of [-1, 1]){
    const p = new THREE.Mesh(new THREE.PlaneGeometry(D, H), sideMat);
    p.position.set(s * W / 2, H / 2, 0); p.rotation.y = -s * Math.PI / 2; p.receiveShadow = true; world.add(p);
  }
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), std(0xf0f0f5));
  ceil.rotation.x = Math.PI / 2; ceil.position.y = H; world.add(ceil);
  add(new THREE.Mesh(new THREE.BoxGeometry(W - .6, .05, .35), new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff6ec, emissiveIntensity: 1.2 })), 0, H - .03, D / 2 - .45);
  for (const xx of (W > 7 ? [-W / 4, W / 4] : [0])){
    const pl = new THREE.PointLight(0xfff4ea, 22, 0, 2); pl.position.set(xx, H - .4, D / 2 - .6); world.add(pl);
  }
  // 레일
  rbox(W - .2, .14, .24, std(0xffffff, { roughness: .4 }), 0, H - .09, 0, .06);

  // 앞 프레임 (분홍 · 둥글게)
  const fw = W + 2 * F, zc = D / 2 + FD / 2;
  const frameMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: .5, clearcoat: .4, clearcoatRoughness: .3 });
  const frameMat2 = new THREE.MeshPhysicalMaterial({ color: 0x3a9bfa, roughness: .45, clearcoat: .5 });
  rbox(fw, HT, FD, frameMat, 0, H + HT / 2 - .05, zc, .35);
  rbox(fw, HB, FD, frameMat2, 0, -HB / 2 + .05, zc, .3);
  rbox(F + .1, H, FD, frameMat, -W / 2 - F / 2 + .05, H / 2, zc, .25);
  rbox(F + .1, H, FD, frameMat, W / 2 + F / 2 - .05, H / 2, zc, .25);
  // 유리 테두리 (하얀 띠)
  const lip = std(0x0b0b45, { roughness: .4 });
  rbox(W, .14, .14, lip, 0, H - .06, D / 2 + .03, .06);
  rbox(W, .14, .14, lip, 0, .07, D / 2 + .03, .06);
  rbox(.14, H, .14, lip, -W / 2 + .07, H / 2, D / 2 + .03, .06);
  rbox(.14, H, .14, lip, W / 2 - .07, H / 2, D / 2 + .03, .06);

  // 간판
  const sw = Math.min(fw - .9, 6.2), sh = HT - .5;
  const signTex = canvasTex('sign' + W, 1600, Math.round(1600 * sh / sw), (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `700 ${Math.round(h * .66)}px Gaegu, cursive`;
    const tx = w / 2, ty = h * .46;
    g.fillStyle = INK; g.fillText('LUCKY GRAB', tx, ty);
    const tw = g.measureText('LUCKY GRAB').width;
    g.strokeStyle = '#3a9bfa'; g.lineWidth = h * .06; g.lineCap = 'round';
    g.beginPath(); g.moveTo(tx - tw / 2, h * .8); g.quadraticCurveTo(tx, h * .86, tx + tw / 2, h * .79); g.stroke();
    paw(g, w * .07, h * .52, h * .3, '#b0d1f0');
    paw(g, w * .93, h * .52, h * .3, '#f3c9a8');
  });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(sw, sh), new THREE.MeshStandardMaterial({ map: signTex, roughness: .55 }));
  sign.position.set(0, H + HT / 2, D / 2 + FD + .01); world.add(sign);

  // 고양이 귀 (기계 위)
  const earMat = frameMat, inner = std(0xf1bccd, { roughness: .5 });
  for (const s of [-1, 1]){
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.95, 1.3, 4, 1), earMat);
    ear.rotation.y = Math.PI / 4; ear.scale.z = .45;
    const eg = new THREE.Group(); eg.add(ear);
    const inn = new THREE.Mesh(new THREE.ConeGeometry(.55, .8, 4, 1), inner);
    inn.rotation.y = Math.PI / 4; inn.scale.z = .2; inn.position.set(0, -.12, .2); eg.add(inn);
    eg.position.set(s * (fw / 2 - 1.3), H + HT + .5, zc); eg.rotation.z = -s * .22;
    world.add(eg);
  }

  // 배경 벽 (크림색 물방울 무늬, 가운데는 구멍)
  const shp = new THREE.Shape();
  shp.moveTo(-60, -30); shp.lineTo(60, -30); shp.lineTo(60, 40); shp.lineTo(-60, 40); shp.lineTo(-60, -30);
  const hole = new THREE.Path(), hx = fw / 2 - .35;
  hole.moveTo(-hx, -HB + .35); hole.lineTo(-hx, H + HT - .35); hole.lineTo(hx, H + HT - .35); hole.lineTo(hx, -HB + .35); hole.lineTo(-hx, -HB + .35);
  shp.holes.push(hole);
  const wt = canvasTex('wall', 256, 256, (g, w, h) => {
    g.fillStyle = '#fafafa'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#eaf3fc';
    for (const [x, y] of [[64, 64], [192, 192]]){ g.beginPath(); g.arc(x, y, 18, 0, 7); g.fill(); }
    g.fillStyle = '#fdf1e8';
    for (const [x, y] of [[192, 64], [64, 192]]){ g.beginPath(); g.arc(x, y, 12, 0, 7); g.fill(); }
  }, true);
  wt.repeat.set(1 / 2.2, 1 / 2.2);
  const wall = new THREE.Mesh(new THREE.ShapeGeometry(shp), new THREE.MeshStandardMaterial({ map: wt, roughness: .95 }));
  wall.position.z = D / 2 + .1; wall.receiveShadow = true; world.add(wall);
  // 바닥 선반
  rbox(fw + 3, .3, 2.4, std(0xe3e3ea, { roughness: .8 }), 0, -HB - .1, D / 2 + .8, .12);

  // 그림자 범위
  sun.position.set(3, H + 9, D / 2 + 9); sun.target.position.set(0, 1.5, 0);
  const sc = sun.shadow.camera; sc.left = -W / 2 - 3; sc.right = W / 2 + 3; sc.top = H + 3; sc.bottom = -3; sc.near = 1; sc.far = 40;
  sc.updateProjectionMatrix();

  makeChute(-1, P1C);
  if (mode === 'duo') makeChute(1, P2C);

  if (mode === 'duo'){
    claws.push(makeClawState(0, P1C, -1.6, chutes[0], ['ArrowLeft'], ['ArrowRight'], ['Space']));
    claws.push(makeClawState(1, P2C, 1.6, chutes[1], ['KeyA'], ['KeyD'], ['KeyS']));
  } else {
    claws.push(makeClawState(0, P1C, .6, chutes[0], ['ArrowLeft', 'KeyA'], ['ArrowRight', 'KeyD'], ['Space', 'KeyS']));
  }
  spawnBalls();
  fitCamera();
}

function makeChute(side, color){
  const cw = 1.8, ch = 3.2, { W, D } = G;
  const cx = side * (W / 2 - cw / 2);
  const body = new THREE.Mesh(new THREE.BoxGeometry(cw - .04, ch, D - .04),
    new THREE.MeshPhysicalMaterial({ color, transparent: true, opacity: .16, roughness: .1, depthWrite: false, side: THREE.DoubleSide }));
  body.position.set(cx, ch / 2, 0); world.add(body);
  const hole = new THREE.Mesh(new THREE.PlaneGeometry(cw - .14, D - .14), new THREE.MeshBasicMaterial({ color: 0x0b0b45, transparent: true, opacity: .25 }));
  hole.rotation.x = -Math.PI / 2; hole.position.set(cx, ch - .01, 0); world.add(hole);
  const rimMat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .15, roughness: .35 });
  const t = .1;
  [[cw, t, t, cx, ch, D / 2 - t / 2], [cw, t, t, cx, ch, -D / 2 + t / 2],
   [t, t, D, cx - cw / 2 + t / 2, ch, 0], [t, t, D, cx + cw / 2 - t / 2, ch, 0],
   [t, ch, t, cx - side * (cw / 2 - t / 2), ch / 2, D / 2 - t / 2]
  ].forEach(a => { const m = new THREE.Mesh(new RoundedBoxGeometry(a[0], a[1], a[2], 2, .04), rimMat); m.position.set(a[3], a[4], a[5]); m.castShadow = true; world.add(m); });
  const hex = '#' + color.toString(16).padStart(6, '0');
  const lt = canvasTex('drop' + side, 320, 200, (g, w, h) => {
    g.fillStyle = '#fff'; g.beginPath(); g.roundRect(6, 6, w - 12, h - 12, 18); g.fill();
    g.lineWidth = 6; g.strokeStyle = hex; g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = '700 86px Gaegu, cursive'; g.fillStyle = hex; g.fillText('DROP', w / 2 + 24, 76);
    paw(g, 58, 80, 46, hex);
    g.font = '700 28px "Gothic A1", sans-serif'; g.fillStyle = INK; g.fillText('황금 냥이 = 3점', w / 2, 150);
  });
  const label = new THREE.Mesh(new THREE.PlaneGeometry(1.4, .875), new THREE.MeshBasicMaterial({ map: lt, transparent: true }));
  label.position.set(cx, ch * .56, D / 2 - .03); world.add(label);
  chutes.push({ side, cx, x0: cx - cw / 2, x1: cx + cw / 2, top: ch, rimMat, pulse: 0 });
}

/* ---------------- 집게 ---------------- */
class Helix extends THREE.Curve {
  getPoint(t, o = new THREE.Vector3()){ const a = t * Math.PI * 2 * 8; return o.set(Math.cos(a) * .14, .22 + t * .92, Math.sin(a) * .14); }
}
const prongCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 0, 0), new THREE.Vector3(.4, -.38, 0), new THREE.Vector3(.55, -.95, 0), new THREE.Vector3(.25, -1.45, 0)
]);
const OPEN_TH = .5, SHUT_TH = -.17, HOLD_TH = 0;

function makeClawMesh(color){
  const g = new THREE.Group();
  const col = new THREE.MeshPhysicalMaterial({ color, roughness: .3, clearcoat: .8, clearcoatRoughness: .15 });
  const spring = new THREE.Mesh(new THREE.TubeGeometry(new Helix(), 360, .05, 10), col); spring.castShadow = true; g.add(spring);
  const put = (geo, mat, y) => { const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; g.add(m); return m; };
  put(new THREE.CylinderGeometry(.1, .1, .14, 20), whiteMat, 1.22);
  const head = put(new THREE.SphereGeometry(.34, 32, 20), col, .1); head.scale.set(1, .72, 1);
  put(new THREE.CylinderGeometry(.36, .36, .1, 32), whiteMat, -.07);
  // 집게 머리 위 작은 고양이 귀
  for (const s of [-1, 1]){
    const ear = new THREE.Mesh(new THREE.ConeGeometry(.11, .2, 12), col);
    ear.position.set(s * .2, .33, .05); ear.rotation.z = -s * .45; ear.castShadow = true; g.add(ear);
  }
  // 얼굴 (앞쪽)
  const fc = document.createElement('canvas'); fc.width = 128; fc.height = 64;
  const fg = fc.getContext('2d'); fg.fillStyle = INK;
  fg.beginPath(); fg.arc(44, 26, 6, 0, 7); fg.arc(84, 26, 6, 0, 7); fg.fill();
  fg.strokeStyle = INK; fg.lineWidth = 4; fg.lineCap = 'round';
  fg.beginPath(); fg.moveTo(56, 38); fg.quadraticCurveTo(60, 44, 64, 38); fg.quadraticCurveTo(68, 44, 72, 38); fg.stroke();
  fg.fillStyle = 'rgba(255,255,255,.6)'; fg.beginPath(); fg.ellipse(28, 40, 9, 5, 0, 0, 7); fg.ellipse(100, 40, 9, 5, 0, 0, 7); fg.fill();
  const ft = new THREE.CanvasTexture(fc); ft.colorSpace = THREE.SRGBColorSpace;
  const face = new THREE.Mesh(new THREE.PlaneGeometry(.44, .22), new THREE.MeshBasicMaterial({ map: ft, transparent: true }));
  face.position.set(0, .12, .345); g.add(face);

  const prongGeo = new THREE.TubeGeometry(prongCurve, 28, .065, 12);
  const tipGeo = new THREE.SphereGeometry(.1, 16, 12);
  const pivots = [], tips = [], mids = [];
  for (let k = 0; k < 3; k++){
    const a = k * Math.PI * 2 / 3 + Math.PI / 2;
    const piv = new THREE.Group();
    piv.position.set(Math.cos(a) * .26, -.1, Math.sin(a) * .26);
    piv.rotation.y = -a;
    const pm = new THREE.Mesh(prongGeo, whiteMat); pm.castShadow = true; piv.add(pm);
    piv.add(new THREE.Mesh(new THREE.SphereGeometry(.1, 16, 12), col));
    const tipBall = new THREE.Mesh(tipGeo, col); tipBall.position.set(.25, -1.45, 0); tipBall.castShadow = true; piv.add(tipBall);
    const tip = new THREE.Object3D(); tip.position.set(.25, -1.45, 0); piv.add(tip);
    const mid = new THREE.Object3D(); mid.position.set(.55, -.95, 0); piv.add(mid);
    g.add(piv); pivots.push(piv); tips.push(tip); mids.push(mid);
  }
  return { group: g, pivots, tips, mids };
}

function makeClawState(i, color, x, chute, left, right, grab){
  const m = makeClawMesh(color); world.add(m.group);
  const cable = new THREE.Mesh(new THREE.CylinderGeometry(.025, .025, 1, 8), whiteMat); world.add(cable);
  const c = {
    i, color, x, y: Y_TOP, state: 'idle', open: .55, th: SHUT_TH, closeTh: SHUT_TH, timer: TURN, auto: false, downT: 0,
    held: null, hoff: new THREE.Vector3(), slip: false, slipY: 0, score: 0, chute, chuteX: chute.cx,
    binds: { left, right, grab }, mesh: m, cable,
    cols: [{ c: new THREE.Vector3(), r: .38 }, ...[0, 1, 2, 3, 4, 5].map(() => ({ c: new THREE.Vector3(), r: .13 }))],
    tag: $('#t' + (i + 1))
  };
  syncClaw(c);
  return c;
}

function syncClaw(c){
  const g = c.mesh.group;
  g.position.set(c.x, c.y, 0);
  c.th = c.closeTh + (OPEN_TH - c.closeTh) * c.open;
  for (const p of c.mesh.pivots) p.rotation.z = c.th;
  const topY = G.H - .09, bot = c.y + 1.29;
  c.cable.scale.y = Math.max(.01, topY - bot);
  c.cable.position.set(c.x, (topY + bot) / 2, 0);
  g.updateMatrixWorld(true);
  c.cols[0].c.set(c.x, c.y - .1, 0);
  for (let k = 0; k < 3; k++){
    c.mesh.tips[k].getWorldPosition(c.cols[1 + k].c);
    c.mesh.mids[k].getWorldPosition(c.cols[4 + k].c);
  }
}

/* ---------------- 공 ---------------- */
function makeBallMesh(kind, ci){
  const mat = kind === 'gold' ? goldMat : kind === 'cat' ? catMats[ci] : plainMats[ci];
  const mesh = new THREE.Mesh(ballGeo, mat);
  if (kind !== 'plain'){
    const em = kind === 'gold' ? goldEar : earMats[ci];
    for (const s of [-1, 1]){
      const ear = new THREE.Mesh(earGeo, em);
      ear.position.set(s * .5, .8, .12); ear.rotation.set(.1, 0, -s * .55); ear.castShadow = true;
      mesh.add(ear);
    }
  }
  return mesh;
}

function spawnBalls(){
  for (const b of balls) world.remove(b.mesh);
  balls = [];
  const R = Math.random;
  const N = G.mode === 'duo' ? 70 : 37;
  const x0 = -G.W / 2 + 1.8 + .55, x1 = G.W / 2 - (G.mode === 'duo' ? 1.8 : 0) - .55;
  const z0 = -G.D / 2 + .55, z1 = G.D / 2 - .55;
  const cols = Math.max(1, Math.floor((x1 - x0) / 1.08) + 1), rows = Math.max(1, Math.floor((z1 - z0) / 1.08) + 1);
  for (let i = 0; i < N; i++){
    const layer = Math.floor(i / (cols * rows)), k = i % (cols * rows);
    const cx = k % cols, cz = Math.floor(k / cols);
    const roll = R();
    const kind = roll < .11 ? 'gold' : roll < .45 ? 'cat' : 'plain';
    const r = kind === 'gold' ? .47 : .43 + R() * .12;
    const mesh = makeBallMesh(kind, Math.floor(R() * PAL.length));
    mesh.scale.setScalar(r); mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.rotation.set((R() - .5) * 1.2, (R() - .5) * 2.4, (R() - .5) * .8);
    world.add(mesh);
    const p = new THREE.Vector3(
      cols > 1 ? x0 + cx * (x1 - x0) / (cols - 1) + (R() - .5) * .2 : (x0 + x1) / 2,
      .6 + layer * 1.1 + R() * .2,
      rows > 1 ? z0 + cz * (z1 - z0) / (rows - 1) + (R() - .5) * .2 : 0);
    balls.push({ p, v: new THREE.Vector3((R() - .5), 0, (R() - .5)), r, gold: kind === 'gold', mesh, held: null, dropping: null, gone: false, landT: 0 });
  }
  for (let s = 0; s < 260; s++) physics(1 / 60);
  syncBalls(0);
}

/* ---------------- 물리 (공끼리 · 벽 · 집게) ---------------- */
const GRAV = 16, E = .22;
function physics(dt){
  const sub = 3, h = dt / sub, W2 = G.W / 2, D2 = G.D / 2;
  const damp = 1 - .35 * h;
  for (let s = 0; s < sub; s++){
    for (const b of balls){
      if (b.held || b.gone) continue;
      b.v.y -= GRAV * h; b.v.multiplyScalar(damp); b.p.addScaledVector(b.v, h);
    }
    for (let it = 0; it < 2; it++){
      const n = balls.length;
      for (let i = 0; i < n; i++){
        const a = balls[i]; if (a.gone || a.dropping) continue;
        for (let j = i + 1; j < n; j++){
          const b = balls[j]; if (b.gone || b.dropping) continue;
          const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, dz = b.p.z - a.p.z, rr = a.r + b.r;
          const d2 = dx * dx + dy * dy + dz * dz;
          if (d2 >= rr * rr || d2 < 1e-10) continue;
          const wa = a.held ? 0 : 1, wb = b.held ? 0 : 1, ws = wa + wb; if (!ws) continue;
          const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d, pen = rr - d;
          const ka = pen * wa / ws, kb = pen * wb / ws;
          a.p.x -= nx * ka; a.p.y -= ny * ka; a.p.z -= nz * ka;
          b.p.x += nx * kb; b.p.y += ny * kb; b.p.z += nz * kb;
          const rvx = b.v.x - a.v.x, rvy = b.v.y - a.v.y, rvz = b.v.z - a.v.z;
          const vn = rvx * nx + rvy * ny + rvz * nz;
          if (vn < 0){
            const jj = -(1 + E) * vn / ws;
            const tx = rvx - vn * nx, ty = rvy - vn * ny, tz = rvz - vn * nz, f = .1 / ws;
            a.v.x -= nx * jj * wa - tx * f * wa; a.v.y -= ny * jj * wa - ty * f * wa; a.v.z -= nz * jj * wa - tz * f * wa;
            b.v.x += nx * jj * wb - tx * f * wb; b.v.y += ny * jj * wb - ty * f * wb; b.v.z += nz * jj * wb - tz * f * wb;
          }
        }
      }
      for (const c of claws){
        for (const col of c.cols){
          for (const b of balls){
            if (b.gone || b.held || b.dropping) continue;
            const dx = b.p.x - col.c.x, dy = b.p.y - col.c.y, dz = b.p.z - col.c.z, rr = b.r + col.r;
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 >= rr * rr || d2 < 1e-10) continue;
            const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, nz = dz / d;
            b.p.x = col.c.x + nx * rr; b.p.y = col.c.y + ny * rr; b.p.z = col.c.z + nz * rr;
            const vn = b.v.x * nx + b.v.y * ny + b.v.z * nz;
            if (vn < 0){ b.v.x -= nx * vn * 1.2; b.v.y -= ny * vn * 1.2; b.v.z -= nz * vn * 1.2; }
          }
        }
      }
      for (const b of balls){
        if (b.held || b.gone) continue;
        const r = b.r, p = b.p, v = b.v;
        if (p.y < r){ p.y = r; if (v.y < 0) v.y *= -E; v.x *= .985; v.z *= .985; }
        if (p.y > G.H - r){ p.y = G.H - r; if (v.y > 0) v.y = 0; }
        if (p.x < -W2 + r){ p.x = -W2 + r; if (v.x < 0) v.x *= -E; }
        if (p.x > W2 - r){ p.x = W2 - r; if (v.x > 0) v.x *= -E; }
        if (p.z < -D2 + r){ p.z = -D2 + r; if (v.z < 0) v.z *= -E; }
        if (p.z > D2 - r){ p.z = D2 - r; if (v.z > 0) v.z *= -E; }
        if (!b.dropping){
          for (const ch of chutes){
            if (p.x > ch.x0 && p.x < ch.x1 && p.y < ch.top){
              const up = ch.top - p.y, side = ch.side < 0 ? ch.x1 - p.x : p.x - ch.x0;
              if (up < side){ p.y = ch.top + r; if (v.y < 0) v.y *= -E; }
              else { p.x = ch.side < 0 ? ch.x1 + r : ch.x0 - r; v.x = 0; }
              continue;
            }
            const cx = Math.max(ch.x0, Math.min(ch.x1, p.x)), cy = Math.max(0, Math.min(ch.top, p.y));
            const dx = p.x - cx, dy = p.y - cy, d2 = dx * dx + dy * dy;
            if (d2 < r * r && d2 > 1e-10){
              const d = Math.sqrt(d2), nx = dx / d, ny = dy / d;
              p.x = cx + nx * r; p.y = cy + ny * r;
              const vn = v.x * nx + v.y * ny;
              if (vn < 0){ v.x -= nx * vn * (1 + E); v.y -= ny * vn * (1 + E); }
            }
          }
        }
      }
    }
  }
}

const _q = new THREE.Quaternion(), _ax = new THREE.Vector3();
function syncBalls(dt){
  for (const b of balls){
    if (b.gone) continue;
    b.mesh.position.copy(b.p);
    if (!b.held && dt > 0){
      const sp = Math.hypot(b.v.x, b.v.z);
      if (sp > .03){ _ax.set(b.v.z, 0, -b.v.x).normalize(); _q.setFromAxisAngle(_ax, sp * dt / b.r); b.mesh.quaternion.premultiply(_q); }
    }
    if (b.dropping && b.p.y < b.r + .02){
      b.landT += dt;
      if (b.landT > .15) win(b);
    }
  }
}

/* ---------------- 게임 흐름 ---------------- */
const game = { phase: 'start', countT: 0, lastCount: null };
const keys = new Set(), pressedNow = new Set();
const isDown = list => list.some(k => keys.has(k));
const pressed = list => list.some(k => pressedNow.has(k));

function startDown(c, auto){ c.state = 'down'; c.auto = auto; c.downT = 0; sfx.whir(); }

function landed(c){
  for (const b of balls){
    if (b.gone || b.held || b.dropping) continue;
    const hx = b.p.x - c.x, hz = b.p.z;
    if (hx * hx + hz * hz < .45 * .45 && b.p.y + b.r > c.y - .45) return true;
  }
  return false;
}

function beginClose(c){
  c.state = 'close';
  const gy = c.y - .95;
  let best = null, bd = 1e9;
  for (const b of balls){
    if (b.gone || b.held || b.dropping) continue;
    const hx = b.p.x - c.x, hz = b.p.z, hd = Math.hypot(hx, hz);
    if (hd > .85 || Math.abs(b.p.y - gy) > .8) continue;
    const d = Math.hypot(hd, b.p.y - gy);
    if (d < bd){ bd = d; best = b; }
  }
  c.closeTh = SHUT_TH;
  if (best){
    const hd = Math.hypot(best.p.x - c.x, best.p.z);
    let chance = hd < .35 ? .9 : hd < .6 ? .6 : .3;
    if (best.gold) chance *= .8;
    if (Math.random() < chance){
      c.held = best; best.held = c; best.v.set(0, 0, 0);
      c.hoff.set(best.p.x - c.x, best.p.y - c.y, best.p.z);
      c.closeTh = HOLD_TH;
      c.slip = Math.random() < (best.gold ? .3 : .12);
      c.slipY = c.y + (Y_TOP - c.y) * (.35 + Math.random() * .45);
    }
  }
}

function dropHeld(c, slip){
  const b = c.held; if (!b) return;
  b.held = null; c.held = null;
  if (slip){ b.v.set((Math.random() - .5) * 1.6, -.5, (Math.random() - .5)); c.closeTh = SHUT_TH; sfx.slip(); }
  else { b.dropping = c; b.v.set(0, -1, 0); }
}

const _tgt = new THREE.Vector3();
function updateClaw(c, dt){
  const play = game.phase === 'play';
  switch (c.state){
    case 'idle': {
      c.open += (.55 - c.open) * Math.min(1, dt * 4);
      if (!play) break;
      const dir = (isDown(c.binds.right) ? 1 : 0) - (isDown(c.binds.left) ? 1 : 0);
      c.x += dir * 3.4 * dt;
      c.timer -= dt;
      if (pressed(c.binds.grab)) startDown(c, false);
      else if (c.timer <= 0) startDown(c, true);
      break;
    }
    case 'down': {
      c.downT += dt;
      c.open = Math.min(1, c.open + dt * 3);
      const hold = c.auto || isDown(c.binds.grab) || c.downT < .3;
      if (hold) c.y -= 2.8 * dt;
      if (!hold || c.y <= Y_MIN || landed(c)){ c.y = Math.max(c.y, Y_MIN); beginClose(c); sfx.clamp(); }
      break;
    }
    case 'close':
      c.open -= dt * 2.4;
      if (c.open <= 0){ c.open = 0; c.state = 'up'; }
      break;
    case 'up':
      c.y += 2.4 * dt;
      if (c.held && c.slip && c.y > c.slipY) dropHeld(c, true);
      if (!c.held && c.y > c.slipY + .6) c.open = Math.min(.55, c.open + dt * .8);
      if (c.y >= Y_TOP){ c.y = Y_TOP; if (c.held) c.state = 'carry'; else { c.state = 'idle'; c.timer = TURN; } }
      break;
    case 'carry': {
      const dx = c.chuteX - c.x, s = 3.4 * dt;
      if (Math.abs(dx) <= s){ c.x = c.chuteX; c.state = 'release'; } else c.x += Math.sign(dx) * s;
      break;
    }
    case 'release':
      c.open += dt * 2.2;
      if (c.held && c.open > .35) dropHeld(c, false);
      if (c.open >= 1){ c.open = 1; c.state = 'idle'; c.timer = TURN; c.closeTh = SHUT_TH; }
      break;
  }
  let lo = -G.W / 2 + .9, hi = G.W / 2 - .9;
  if (claws.length === 2){
    if (c.i === 0) hi = Math.min(hi, claws[1].x - 2.1);
    else lo = Math.max(lo, claws[0].x + 2.1);
  }
  c.x = Math.max(lo, Math.min(hi, c.x));
  if (c.held){
    const b = c.held;
    c.hoff.lerp(_tgt.set(0, -.95, 0), 1 - Math.exp(-10 * dt));
    b.p.set(c.x + c.hoff.x, c.y + c.hoff.y, c.hoff.z); b.v.set(0, 0, 0);
  }
  // 대기 중에는 살랑살랑
  c.mesh.group.rotation.z = c.state === 'idle' ? Math.sin(performance.now() / 500 + c.i) * .03 : 0;
}

function win(b){
  b.gone = true; world.remove(b.mesh);
  const c = b.dropping, pts = b.gold ? 3 : 1;
  c.score += pts; renderScores();
  c.chute.pulse = 1;
  popup(c, pts);
  sfx.win(pts > 1);
}

function popup(c, pts){
  const el = document.createElement('div');
  el.className = 'pop ' + (c.i ? 'p2' : 'p1');
  el.innerHTML = '+' + pts + '<small>' + (pts > 1 ? '황금 냥이!' : '냥!') + '</small>';
  const s = toScreen(_tgt.set(c.chute.cx, c.chute.top + .8, 0));
  el.style.left = s.x + 'px'; el.style.top = s.y + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function renderScores(){
  const s1 = $('#s1'), s2 = $('#s2');
  s1.querySelector('b').textContent = String(claws[0]?.score ?? 0).padStart(2, '0');
  s2.querySelector('b').textContent = String(claws[1]?.score ?? 0).padStart(2, '0');
  s2.classList.toggle('off', G.mode !== 'duo');
  s1.querySelector('small').textContent = G.mode === 'duo' ? 'PLAYER 1' : 'SCORE';
}

function toScreen(v){
  const p = v.clone().project(camera);
  return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
}

const CIRC = 2 * Math.PI * 15;
document.querySelectorAll('.tag .fg').forEach(e => { e.style.strokeDasharray = CIRC; });
function updateTags(){
  for (const id of ['#t1', '#t2']){ const t = $(id); if (!claws.some(c => c.tag === t)) t.classList.add('hide'); }
  for (const c of claws){
    const t = c.tag;
    t.classList.toggle('hide', !(game.phase === 'play' || game.phase === 'count'));
    const s = toScreen(_tgt.set(c.x + .62, c.y + .95, 0));
    t.style.transform = `translate(${s.x}px,${s.y}px) translate(0,-50%)`;
    const left = c.state === 'idle' ? Math.max(0, c.timer) : 0;
    t.querySelector('.num').textContent = c.state === 'idle' ? Math.ceil(left) : '·';
    t.querySelector('.fg').style.strokeDashoffset = CIRC * (1 - left / TURN);
  }
}

function updateGame(dt){
  if (game.phase === 'count'){
    game.countT -= dt;
    const n = Math.ceil(game.countT - .8);
    const label = n > 0 ? String(n) : 'GO!';
    if (label !== game.lastCount){
      game.lastCount = label;
      const el = $('#count'); el.textContent = label; el.className = ''; void el.offsetWidth; el.className = 'anim';
      el.style.color = n > 0 ? '#0b0b45' : '#3a9bfa';
      sfx.beep(n <= 0);
      if (n <= 0){ game.phase = 'play'; for (const c of claws) c.timer = TURN; setTimeout(() => { if (el.textContent === 'GO!') el.className = 'fade'; }, 500); }
    }
  }
  for (const ch of chutes){
    ch.pulse = Math.max(0, ch.pulse - dt * 1.5);
    ch.rimMat.emissiveIntensity = .15 + ch.pulse * 1.2;
  }
}

function startGame(mode){
  initAudio();
  try { history.replaceState(null, '', '#' + mode); } catch (e) {}
  buildWorld(mode);
  renderScores();
  $('#start').classList.add('hide');
  $('#help').innerHTML = helpHTML(mode);
  $('#help').classList.toggle('hide', helpHidden);
  game.phase = 'count'; game.countT = 3.8; game.lastCount = null;
  $('#count').textContent = ''; $('#count').className = '';
}

function toStart(){
  game.phase = 'start';
  $('#start').classList.remove('hide');
  $('#help').classList.add('hide');
  $('#count').textContent = '';
  for (const c of claws){ if (c.held) dropHeld(c, true); if (c.state !== 'idle') c.state = 'up'; }
  selectCard(G.mode);
}

function helpHTML(mode){
  const common = '<span class="g">꾹 누르면 더 깊이 · 20초 지나면 자동으로 집어요</span>' +
    '<span class="g"><kbd>M</kbd> 소리 <kbd>Q</kbd> 화질 <kbd>R</kbd> 공 채우기 <kbd>H</kbd> 안내 <kbd>F</kbd> 전체화면 <kbd>ESC</kbd> 처음으로</span>';
  if (mode === 'duo') return '<span class="g"><span class="l">민트</span> <kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>SPACE</kbd> 집기</span>' +
    '<span class="g"><span class="p">주황</span> <kbd>A</kbd> <kbd>D</kbd> 이동 · <kbd>S</kbd> 집기</span>' + common;
  return '<span class="g"><kbd>←</kbd> <kbd>→</kbd> 이동 · <kbd>SPACE</kbd> 집기</span>' + common;
}

function selectCard(mode){
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.mode === mode));
}

let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1400); }

/* ---------------- 입력 ---------------- */
let helpHidden = false;
const GAME_KEYS = new Set(['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']);
addEventListener('keydown', e => {
  if (GAME_KEYS.has(e.code)) e.preventDefault();
  initAudio();
  if (!e.repeat) pressedNow.add(e.code);
  keys.add(e.code);
  if (e.repeat) return;
  switch (e.code){
    case 'Digit1': case 'Numpad1': if (game.phase === 'start') startGame('solo'); break;
    case 'Digit2': case 'Numpad2': if (game.phase === 'start') startGame('duo'); break;
    case 'Escape': if (game.phase !== 'start') toStart(); break;
    case 'KeyM': setMuted(!muted); toast(muted ? '소리 끔' : '소리 켬'); break;
    case 'KeyQ': hiQ = !hiQ; applyQuality(); toast('화질 ' + (hiQ ? '높음' : '보통')); break;
    case 'KeyR': if (game.phase !== 'start'){ for (const c of claws) if (c.held) dropHeld(c, true); spawnBalls(); toast('공을 다시 채웠어요'); } break;
    case 'KeyH': helpHidden = !helpHidden; if (game.phase !== 'start') $('#help').classList.toggle('hide', helpHidden); break;
    case 'KeyF': {
      const d = document;
      if (!d.fullscreenElement) d.documentElement.requestFullscreen?.().catch(() => toast('전체화면을 쓸 수 없어요'));
      else d.exitFullscreen?.().catch(() => {});
      break;
    }
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());
addEventListener('pointerdown', () => initAudio());
document.querySelectorAll('.card').forEach(b => {
  b.addEventListener('click', e => { e.currentTarget.blur(); startGame(b.dataset.mode); });
  b.addEventListener('mouseenter', () => selectCard(b.dataset.mode));
});

/* ---------------- 소리 (직접 합성) ---------------- */
let AC = null, master, musicBus, sfxBus, noiseBuf, muted = false;
function initAudio(){
  if (AC){ if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  master = AC.createGain(); master.gain.value = muted ? 0 : .8; master.connect(AC.destination);
  musicBus = AC.createGain(); musicBus.gain.value = .3; musicBus.connect(master);
  sfxBus = AC.createGain(); sfxBus.gain.value = .7; sfxBus.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
  const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  nextT = AC.currentTime + .1; setInterval(sched, 25);
}
function setMuted(m){ muted = m; if (master) master.gain.setTargetAtTime(m ? 0 : .8, AC.currentTime, .05); }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(t, f, dur, type, vol, dest, f2){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(dest); o.start(t); o.stop(t + dur + .03);
}
function noise(t, dur, vol, dest, type = 'highpass', freq = 7000){
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = type; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f).connect(g).connect(dest); s.start(t); s.stop(t + dur + .03);
}
// 통통 튀는 장난감 같은 음악
const BPM = 118, STEP = 60 / BPM / 4;
let nextT = 0, stepI = 0;
const ROOTS = [60, 57, 53, 55], THIRD = [4, 3, 4, 4];
const MEL = [12, null, 7, null, 9, 7, null, 4, 5, null, 4, 2, 4, null, null, null];
function sched(){
  while (nextT < AC.currentTime + .12){ playStep(stepI, nextT); nextT += STEP; stepI = (stepI + 1) % 64; }
}
function playStep(i, t){
  const bar = Math.floor(i / 16), s = i % 16, r = ROOTS[bar];
  if (s % 8 === 0) tone(t, 150, .22, 'sine', .7, musicBus, 55);
  if (s % 4 === 2) noise(t, .03, .12, musicBus, 'highpass', 9000);
  if (s === 4 || s === 12) noise(t, .08, .18, musicBus, 'bandpass', 3000);
  if ([0, 6, 8, 14].includes(s)) tone(t, mtof(r - 24), .22, 'triangle', .5, musicBus);
  if (s % 4 === 2) [0, THIRD[bar], 7].forEach(k => tone(t, mtof(r + k), .12, 'triangle', .06, musicBus));
  const m = MEL[s];
  if (m !== null && bar % 2 === 0) tone(t, mtof(r + 12 + m), .22, 'sine', .12, musicBus);
  if (m !== null && bar % 2 === 1 && s < 8) tone(t, mtof(r + 12 + m - 2), .22, 'sine', .1, musicBus);
}
const sfx = {
  beep(go){ if (!AC) return; const t = AC.currentTime; tone(t, go ? 988 : 660, go ? .45 : .16, 'sine', .25, sfxBus); if (go) tone(t + .06, 1480, .4, 'sine', .14, sfxBus); },
  whir(){ if (!AC) return; const t = AC.currentTime; tone(t, 700, .3, 'sine', .08, sfxBus, 300); },
  clamp(){ if (!AC) return; const t = AC.currentTime; tone(t, 520, .1, 'square', .06, sfxBus, 260); noise(t, .05, .2, sfxBus, 'bandpass', 2500); },
  slip(){ if (!AC) return; const t = AC.currentTime; tone(t, 880, .4, 'sine', .15, sfxBus, 220); },
  win(big){ if (!AC) return; const t = AC.currentTime; const ns = big ? [72, 76, 79, 84, 88, 91] : [76, 79, 84];
    ns.forEach((n, k) => tone(t + k * .07, mtof(n), .28, 'triangle', .16, sfxBus));
    tone(t + ns.length * .07, 1200, .25, 'sine', .1, sfxBus, 1800); }
};

/* ---------------- 화면 크기 · 카메라 ---------------- */
function fitCamera(){
  const w = innerWidth, h = innerHeight, asp = w / h;
  camera.aspect = asp;
  const fw = G.W + 2 * G.F + 1, fh = G.H + G.HT + G.HB + 2.2;
  const tf = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const dist = Math.max((fh / 2) / tf, (fw / 2) / (tf * asp)) * 1.03;
  const cy = (G.H + G.HT + 1.1 - G.HB) / 2;
  camera.position.set(0, cy, G.D / 2 + G.FD + dist);
  camera.lookAt(0, cy, 0);
  camera.updateProjectionMatrix();
}
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  fitCamera();
}
addEventListener('resize', resize);

/* ---------------- 시작 ---------------- */
let last = performance.now(), ready = false;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (ready){
    updateGame(dt);
    for (const c of claws) updateClaw(c, dt);
    for (const c of claws) syncClaw(c);
    physics(dt);
    syncBalls(dt);
    updateTags();
    pressedNow.clear();
  }
  renderer.render(scene, camera);
}

(async () => {
  try { await Promise.race([Promise.all([document.fonts.load('700 80px Gaegu'), document.fonts.load('700 28px "Gothic A1"')]), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  const first = location.hash === '#solo' ? 'solo' : 'duo';
  buildWorld(first);
  selectCard(first);
  renderScores();
  applyQuality();
  ready = true; window.__ready = true;
  requestAnimationFrame(loop);
  setTimeout(() => $('#loading').classList.add('gone'), 150);
})();
</script>
